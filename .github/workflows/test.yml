name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable # go.mod задаёт минимум (1.22), а его сборки не запускаются на новой macOS
      - run: go vet ./...
      - run: go test -v ./...
      - name: тесты в крайних поясах (UTC-11, UTC+14)
        if: runner.os == 'Linux'
        run: make test-tz
